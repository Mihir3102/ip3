<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h2>Calculator</h2>
    <input type="number" name="num1" id="num1" placeholder="Enter no1">
    <input type="number" name="num2" id="num2" placeholder="Enter no2">
    <button type="button" onclick="calci('+')">+</button>
    <button type="button" onclick="calci('-')">-</button>
    <button type="button" onclick="calci('*')">*</button>
    <button type="button" onclick="calci('/')">/</button>
    <h3 id="result"></h3>
    <script src="script.js"></script>
</body>
</html>
